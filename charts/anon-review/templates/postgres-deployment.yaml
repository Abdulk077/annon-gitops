apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        role: database
      containers:
        - name: postgres
          image: postgres:15-alpine
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 1; done
                    psql -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE USER replicator WITH REPLICATION ENCRYPTED PASSWORD '$POSTGRES_REPLICATION_PASSWORD';" 2>/dev/null || true
                    echo "host replication replicator 0.0.0.0/0 md5" >> /var/lib/postgresql/data/pg_hba.conf
                    psql -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT pg_reload_conf();"
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "md5"
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=md5 --auth-local=md5"
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
