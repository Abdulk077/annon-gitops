apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        role: database
      containers:
        - name: postgres
          image: postgres:15-alpine
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
                    
                    if ! grep -q "host replication replicator" /var/lib/postgresql/data/pgdata/pg_hba.conf; then
                      echo "host replication replicator 10.244.0.0/16 md5" > /tmp/hba_new.conf
                      cat /var/lib/postgresql/data/pgdata/pg_hba.conf >> /tmp/hba_new.conf
                      mv /tmp/hba_new.conf /var/lib/postgresql/data/pgdata/pg_hba.conf
                      PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();"
                    fi
                    
                    PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE USER replicator WITH REPLICATION ENCRYPTED PASSWORD '${POSTGRES_REPLICATION_PASSWORD}';" || true
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "md5"
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=md5 --auth-local=md5"
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
