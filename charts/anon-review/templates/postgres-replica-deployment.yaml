apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-replica
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      nodeSelector:
        role: database
      initContainers:
        - name: init-replica
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -U user_anon; do
                echo "Waiting for primary..."; sleep 2;
              done
              PGPASSWORD=$POSTGRES_REPLICATION_PASSWORD pg_basebackup \
                -h postgres-service \
                -U replicator \
                -D /var/lib/postgresql/data \
                -Fp -Xs -R -P
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: replica-storage
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres-replica
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "md5"
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: replica-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: replica-storage
          persistentVolumeClaim:
            claimName: postgres-replica-pvc