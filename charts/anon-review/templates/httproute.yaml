apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: annon-review-route
  namespace: production
spec:
  parentRefs:
    - name: kong-gateway
      namespace: kong
  hostnames:
    - "localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: annon-review-server
          namespace: production
          port: 3000
