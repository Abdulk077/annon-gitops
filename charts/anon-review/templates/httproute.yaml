apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: annon-review-ingress
  namespace: production
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: annon-review-server
                port:
                  number: 3000