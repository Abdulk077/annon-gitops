apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ .Release.Name }}-route"
  namespace: "{{ .Release.Namespace }}"
spec:
  parentRefs:
    - name: kong-gateway
      namespace: kong
  hostnames:
    - "localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: "{{ .Release.Name }}-server"
          port: {{ .Values.service.port }}